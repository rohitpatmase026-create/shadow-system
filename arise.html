<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>⚔ ARISE AI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700;900&display=swap" rel="stylesheet">

<style>

:root{
--bg:#050816;
--card:rgba(17,25,40,0.75);
--accent:#7c3aed;
--accent2:#38bdf8;
--text:#f8fafc;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;

background:
radial-gradient(circle at top,rgba(124,58,237,.25),transparent 30%),
radial-gradient(circle at bottom,rgba(56,189,248,.15),transparent 25%),
linear-gradient(135deg,#020617,#0f172a);

color:white;

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

padding:20px;

overflow:hidden;
}

body::before{
content:'';

position:fixed;
inset:0;

background-image:
linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px);

background-size:50px 50px;

pointer-events:none;
}

.container{
width:100%;
max-width:950px;
}

.logo{
text-align:center;

font-size:65px;
font-weight:900;

margin-bottom:25px;

letter-spacing:4px;

background:linear-gradient(to right,#7c3aed,#38bdf8,#ffffff);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

animation:glow 3s infinite;
}

@keyframes glow{
0%{
transform:scale(1);
}

50%{
transform:scale(1.03);
}

100%{
transform:scale(1);
}
}

.chat-box{

background:var(--card);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,0.08);

border-radius:28px;

padding:22px;

box-shadow:
0 0 40px rgba(0,0,0,.5),
0 0 20px rgba(124,58,237,.2);

}

.status{
display:flex;
justify-content:space-between;
margin-bottom:15px;

font-size:14px;
color:#94a3b8;
}

.online{
display:flex;
align-items:center;
gap:8px;
}

.dot{
width:10px;
height:10px;

background:#22c55e;

border-radius:50%;

box-shadow:0 0 12px #22c55e;

animation:pulse 1.5s infinite;
}

@keyframes pulse{
0%{opacity:1;}
50%{opacity:.4;}
100%{opacity:1;}
}

.messages{
height:430px;

overflow-y:auto;

padding-right:10px;

margin-bottom:20px;
}

.messages::-webkit-scrollbar{
width:5px;
}

.messages::-webkit-scrollbar-thumb{
background:var(--accent);
border-radius:20px;
}

.message{
padding:16px;

border-radius:22px;

margin-bottom:15px;

line-height:1.7;

animation:fade .3s ease;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.user{
background:linear-gradient(135deg,#2563eb,#7c3aed);
text-align:right;
}

.ai{
background:rgba(30,41,59,.9);
}

.input-area{
display:flex;
gap:12px;
}

.input-area input{

flex:1;

padding:16px 22px;

border:none;
outline:none;

border-radius:999px;

background:rgba(15,23,42,.85);

color:white;

font-size:16px;
}

.input-area input:focus{
box-shadow:0 0 20px rgba(124,58,237,.6);
}

button{

border:none;

background:linear-gradient(135deg,#7c3aed,#38bdf8);

color:white;

padding:15px 22px;

border-radius:999px;

cursor:pointer;

font-weight:700;

transition:.3s;
}

button:hover{
transform:scale(1.05);
}

.portal-grid{

margin-top:24px;

display:grid;

grid-template-columns:repeat(auto-fit,minmax(140px,1fr));

gap:14px;
}

.portal{

text-decoration:none;

color:white;

background:rgba(17,25,40,.8);

border:1px solid rgba(255,255,255,.08);

padding:16px;

border-radius:18px;

text-align:center;

transition:.3s;
}

.portal:hover{

transform:translateY(-4px);

background:linear-gradient(
135deg,
rgba(124,58,237,.35),
rgba(56,189,248,.25)
);

}

.typing{
opacity:.7;
font-style:italic;
}

@media(max-width:768px){

.logo{
font-size:42px;
}

.input-area{
flex-direction:column;
}

button{
width:100%;
}

}

</style>
</head>

<body>

<div class="container">

<div class="logo">⚔ ARISE AI ⚔</div>

<div class="chat-box">

<div class="status">

<div class="online">
<div class="dot"></div>
<span>System Active</span>
</div>

<span>Gemini AI Mode</span>

</div>

<div class="messages" id="messages">

<div class="message ai">

⚔ Welcome Hunter...
<br><br>

Main <b>ARISE AI</b> hoon.
<br><br>

✨ Features:
<br>

✔ Gemini AI
<br>

✔ Hindi + English
<br>

✔ Voice AI
<br>

✔ Anime UI
<br>

✔ Smart Chat
<br>

✔ Solo Leveling Theme
<br><br>

🔥 System Ready...

</div>

</div>

<div class="input-area">

<input
type="text"
id="q"
placeholder="Ask anything..."
>

<button onclick="sendMessage()">
Send
</button>

<button onclick="startVoice()">
🎤
</button>

</div>

</div>

<div class="portal-grid">

<a
href="https://aistudio.google.com"
target="_blank"
class="portal"
>
🧠 Gemini
</a>

<a
href="https://tradingview.com"
target="_blank"
class="portal"
>
📈 Trading
</a>

<a
href="https://youtube.com"
target="_blank"
class="portal"
>
▶ YouTube
</a>

<a
href="https://chat.openai.com"
target="_blank"
class="portal"
>
🤖 ChatGPT
</a>

</div>

</div>

<script>

const messages=document.getElementById('messages');

const input=document.getElementById('q');

function addMessage(text,sender){

const div=document.createElement('div');

div.className=`message ${sender}`;

div.innerHTML=text;

messages.appendChild(div);

messages.scrollTop=messages.scrollHeight;

}

async function sendMessage(){

let q=input.value.trim();

if(!q)return;

addMessage(q,'user');

input.value='';

const typing=document.createElement('div');

typing.className='message ai typing';

typing.innerText='⚡ ARISE AI is thinking...';

messages.appendChild(typing);

try{

const response=await fetch(

'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=AIzaSyCO0_V9GPepabJzR2urE0dpeqOBnpQBVUk',

{

method:'POST',

headers:{
'Content-Type':'application/json'
},

body:JSON.stringify({

contents:[
{
parts:[
{
text:q
}
]
}
]

})

}

);

const data=await response.json();

typing.remove();

let aiReply=
data.candidates?.[0]?.content?.parts?.[0]?.text
|| 'No response';

addMessage(aiReply,'ai');

speak(aiReply);

}catch(err){

typing.remove();

addMessage(
'❌ Error: '+err.message,
'ai'
);

}

}

input.addEventListener('keypress',function(e){

if(e.key==='Enter'){

sendMessage();

}

});

function startVoice(){

const recognition=
new(
window.SpeechRecognition
||
window.webkitSpeechRecognition
)();

recognition.lang='hi-IN';

recognition.onresult=function(event){

input.value=
event.results[0][0].transcript;

sendMessage();

};

recognition.start();

}

function speak(text){

const speech=
new SpeechSynthesisUtterance(text);

speech.lang='hi-IN';

window.speechSynthesis.speak(speech);

}

</script>

</body>
</html>
